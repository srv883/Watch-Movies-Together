<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" />
    <div>
      <h1>Watch Together</h1>
      <p id="siteName">Checking site…</p>
    </div>
  </header>

  <p id="pageWarn" class="muted small hidden"></p>

  <section id="notSupported" class="hidden">
    <p class="muted">This page can't run Watch Together. Open the video on any streaming site (Netflix, Prime, JioHotstar, YouTube&hellip;) and click again.</p>
  </section>

  <!-- Create / Join -->
  <section id="setupView">
    <label>Your name
      <input id="nameInput" type="text" maxlength="20" placeholder="e.g. Sourav" />
    </label>

    <button id="createBtn" class="primary">Start Watch Party</button>

    <div class="or"><span>or join a friend</span></div>

    <label>Party code
      <input id="codeInput" type="text" maxlength="6" placeholder="ABC123" autocomplete="off" spellcheck="false" />
    </label>
    <button id="joinBtn">Join Party</button>
  </section>

  <!-- Active party status -->
  <section id="activeView" class="hidden">
    <div class="divider"><span>current party</span></div>
    <p class="code-label">Party code</p>
    <p id="codeDisplay" title="Click to copy">------</p>
    <p id="statusLine"><span class="dot"></span><span id="statusText">…</span></p>
    <button id="copyBtn" class="secondary">Copy code</button>
    <button id="linkBtn" class="primary">Copy invite link</button>
    <button id="leaveBtn" class="danger">Leave party</button>
  </section>

  <script src="popup.js"></script>
</body>
</html>
